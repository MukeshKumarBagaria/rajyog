<!doctype html>
<html>
  <body style="margin:0;padding:32px 16px;background:#fff9f6;font-family:Manrope,Segoe UI,Arial,sans-serif;color:#46333b">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" style="max-width:440px;background:#ffffff;border:1px solid #f0e2e7;border-radius:18px;padding:32px">
            <tr><td style="font-size:18px;font-weight:700;color:#b05676">Rajyog</td></tr>
            <tr><td style="padding-top:16px;font-size:20px;font-weight:700">Reset your password</td></tr>
            <tr><td style="padding-top:8px;font-size:14px;line-height:1.6;color:#866b75">We received a request to reset your Rajyog password. If this wasn’t you, you can safely ignore this email.</td></tr>
            <tr>
              <td style="padding-top:24px">
                <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password"
                   style="display:inline-block;background:#b05676;color:#ffffff;text-decoration:none;font-weight:600;font-size:14px;padding:12px 22px;border-radius:12px">Choose a new password</a>
              </td>
            </tr>
            <tr><td style="padding-top:24px;font-size:12px;color:#987e88">This link expires soon and can be used once.</td></tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
