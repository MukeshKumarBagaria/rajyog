# Supabase CLI configuration (local development: `supabase start`).
# For a hosted project, mirror the [auth] settings in Dashboard → Authentication.
project_id = "rajyog"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 16

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[storage]
enabled = true
file_size_limit = "2MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Rajyog has NO public registration — accounts are provisioned by the owner.
enable_signup = false
minimum_password_length = 8

[auth.rate_limit]
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false
max_frequency = "60s"

[auth.email.template.invite]
subject = "You're invited to Rajyog"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Reset your Rajyog password"
content_path = "./supabase/templates/recovery.html"
