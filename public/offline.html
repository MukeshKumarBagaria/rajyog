<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Rajyog</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #fff9f6; color: #46333b; padding: 16px; }
      @media (prefers-color-scheme: dark) { body { background: #181215; color: #f6e9ee; } .card { background: #221a1e; border-color: #3a2d33; } p { color: #c9b0ba; } }
      .card { max-width: 380px; text-align: center; background: #fff; border: 1px solid #f0e2e7; border-radius: 18px; padding: 32px 24px; }
      img { width: 56px; height: 56px; border-radius: 14px; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { font-size: 14px; line-height: 1.6; color: #866b75; margin: 0 0 20px; }
      button { background: #b05676; color: #fff; border: 0; border-radius: 12px; padding: 10px 20px; font-weight: 600; font-size: 14px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="" />
      <h1>You’re offline</h1>
      <p>Your recent lecture progress is saved on this device and will sync automatically when you reconnect. A good moment for revision from your notes.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
